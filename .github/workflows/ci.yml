name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nftables and shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck nftables

      - name: ShellCheck
        run: shellcheck -s bash -S warning athena athena-server tests/*.sh

      - name: Unit tests
        run: bash tests/unit.sh

      - name: Integration tests (real nftables in a private netns)
        run: sudo -E bash tests/integration.sh
