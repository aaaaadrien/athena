# Configuration Athena

# Nombre d'échecs d'authentification avant qu'une IP soit bannie
THRESHOLD=2

# Durée du ban en secondes (3600 = 1 heure)
BAN_TIME=3600

# Fenêtre de temps en secondes dans laquelle les échecs sont comptabilisés
# Ex : 600 = une IP doit échouer THRESHOLD fois en moins de 10 minutes pour être bannie
FIND_TIME=600

# Intervalle en secondes entre chaque analyse du fichier de log
CHECK_INTERVAL=5

# Liste blanche : ces IPs ou plages CIDR ne seront jamais bannies
# Séparer les entrées par des espaces
WHITE_LIST="127.0.0.1 192.168.21.0/24"

# Stratégie de blocage :
# - "all" : Bloque tout le trafic provenant de l'IP (comportement par défaut)
# - "22,80,443" : Bloque uniquement les ports listés (séparés par des virgules)
PORT_BLOCK="all"
